  # About Section
  about:
    enable: true
    title: "About Me"
    content: |-
      I am an **AI Software Engineer II at Garmin Ltd.** (Nov 2023 – present, promoted Jun 2026), where I lead the development of an organization-wide computer vision platform scaling across **200+ active production services**.

      I drive GenAI adoption from research to production: by platformizing model access, the GenAI API platform I administer now powers **30+ LLM/VLM use cases** across the company. On top of it, I am building an **internal agentic AI system** that orchestrates the platform's APIs through LangGraph behind a conversational frontend. I also mentor interns on AI system design and oversee cross-functional AI infrastructure end-to-end.

      Previously, I completed my **Master's in Electrical Engineering at NTHU**, conducting research in computer vision under Prof. Min Sun, which resulted in a publication at **ICRA 2021**.
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "Python"
        - "PyTorch / OpenCV"
        - "Computer Vision"
        - "LLM / VLM"
        - "LangGraph / Agents"
        - "Docker / Kubernetes"
        - "Apache Kafka"
        - "Kong API Gateway"
        - "Grafana"
        - "MySQL / MongoDB"
        - "GitLab CI/CD"
        - "vLLM"
        - "C++ (CUDA/OpenMP/MPI)"

