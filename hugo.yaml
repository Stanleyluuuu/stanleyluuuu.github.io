  # Projects Section
  projects:
    enable: true
    items:
      - title: "Multimodal Tool-calling AI Agent"
        content: |
          End-to-end Owner at Garmin (May 2026 – present).
          Building a stateful tool-calling agent on LangGraph with an internally hosted LLM as its reasoning core, orchestrating multi-step workflows — object detection, OCR, and TTS/ASR — from natural language prompts. Designing structured tool schemas and deterministic error-recovery graphs to keep the agent dependable across long, multi-step tasks.
        badges:
          - "LangGraph"
          - "LangChain"
          - "LLM Agents"
          - "Multimodal"

      - title: "Real-time CV Surveillance & Analytics Platform"
        content: |
          End-to-end Owner & Maintainer at Garmin (Nov 2023 – present).
          Built an enterprise computer vision pipeline that runs across **5 sites**, processing **63M+ telemetry events/month** through Apache Kafka and fusing detection, tracking, and pose estimation to deliver **~4,000 critical alerts/month**, with results persisted to MySQL/MongoDB for analytics. A major refactor **cut per-model GPU memory by 70%** (2 GB → 600 MB) and **tripled the models served per GPU** by deduplicating model instances across containers and adopting FP16 half-precision.
        badges:
          - "Python"
          - "Computer Vision"
          - "VLM"
          - "Apache Kafka"
          - "MySQL"
          - "MongoDB"

      - title: "AI-Powered Document Inspection System"
        content: |
          End-to-end Owner at Garmin (Mar 2024 – present).
          Built an automated document-verification pipeline that combined rule-based parsing with VLM-based data extraction, **saving 5,300+ manual hours a year across 3 business units**. Replacing legacy OCR with robust VLM extraction resolved systemic text and barcode misinterpretation, enabling automated compliance validation across hundreds of pages per document.
        badges:
          - "Python"
          - "VLM"
          - "OCR"
          - "Computer Vision"
          - "Automation"

      - title: "Enterprise GenAI Platform — LLM/VLM Serving & Evaluation"
        content: |
          Platform Owner at Garmin (Apr 2024 – present).
          Built the company's automated LLM/VLM evaluation framework (LLM-as-judge, Ragas) and tuned the serving stack — a 2nd-generation VLM **tripled inference speed (3×) with higher accuracy**. The platform runs on Kubernetes and scales to **30+ production use cases across 8 teams**, handling **2M+ requests/week**. I designed its API gateway layer on Kong across **16 APIs / 52 projects**, sustaining **~99.9% availability** with zero production outages, and built Grafana dashboards that surfaced anomalies — Kong blocked **~4,000 unauthorized requests**. I also shipped reusable tool-calling configs and skill packages that expose platform APIs to internal AI coding agents.
        badges:
          - "vLLM"
          - "LLM / VLM"
          - "Ragas"
          - "Kubernetes"
          - "Kong Gateway"
          - "Grafana"

      - title: "Robust 360-8PA (ICRA 2021)"
        content: |
          Redesigning the normalized 8-point algorithm for 360° FoV images.
          Published at **IEEE International Conference on Robotics and Automation (ICRA), 2021**.
        featured:
          name: "arXiv"
          link: https://arxiv.org/abs/2104.10900
        badges:
          - "Computer Vision"
          - "Python"
          - "Research"
        links:
