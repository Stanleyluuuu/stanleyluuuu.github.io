  # About Section
  about:
    enable: true
    title: "About Me"
    content: |-
      I am an **AI Software Engineer II at Garmin Ltd.** (Nov 2023 – present, promoted Jun 2026), where I own the company's enterprise GenAI platform — LLM/VLM serving on vLLM with an automated evaluation framework — now scaling to **30+ production use cases across 8 teams** and **2M+ requests/week**.

      I also build and operate a **real-time computer vision platform** across **5 sites**, processing **63M+ telemetry events/month** to deliver critical operational alerts. Most recently I am building a **multimodal tool-calling AI agent** on LangGraph that orchestrates detection, OCR, and speech workflows from natural language. I mentor engineering interns and serve as a technical interviewer.

      Previously, I completed my **Master's in Electrical Engineering at NTHU**, conducting computer vision research under Prof. Min Sun, which resulted in a publication at **ICRA 2021**.
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
