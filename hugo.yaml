  # Projects Section
  projects:
    enable: true
    items:
      - title: "Internal Agentic AI Assistant"
        content: |
          Lead Developer at Garmin (Jun 2026 – present).
          Conversational agent built on LangGraph, with Garmin's internal LLM API as the reasoning core. APIs from the internal GenAI platform I administer — spanning language, LLM, and CV categories — are exposed as callable tools: users drop text, images, or audio into a chat frontend, and the agent plans and chains the right tools to complete the task.
        badges:
          - "LangGraph"
          - "LLM Agents"
          - "Python"
          - "Multimodal"

      - title: "Scalable AI Surveillance & Analytics Platform"
        content: |
          Lead Developer & PM at Garmin (Nov 2023 – present).
          Centralized platform running **200+ camera-stream CV inference services** that automate monitoring of physical facility operations. Owns the pipeline end-to-end — stream ingestion, model inference, and real-time anomaly alerts published via Apache Kafka — with detection results persisted to MySQL/MongoDB for analytics.
        badges:
          - "Python"
          - "Computer Vision"
          - "Apache Kafka"
          - "MySQL"
          - "MongoDB"

      - title: "AI-Powered Document Inspection System"
        content: |
          Sole Developer & PM at Garmin (Mar 2024 – present).
          Automated document verification combining OCR with CV-based image comparison, **cutting manual inspection time by 90%** while improving defect detection accuracy. The key design choice: a human-in-the-loop flow that auto-clears low-risk documents, so operators review only flagged anomalies instead of every page.
        badges:
          - "Python"
          - "OCR"
          - "Computer Vision"
          - "Automation"

      - title: "Enterprise VLM/LLM Research & API Governance"
        content: |
          AI Researcher & Platform Owner at Garmin (Apr 2024 – present).
          Evaluate emerging models and inference frameworks (vLLM and peers) through structured POCs, turning results into technical assessments that drive company-wide model selection. Administer the internal GenAI API platform on Kong Gateway — API key lifecycle, access control, rate limiting — with usage observability via Grafana dashboards. Platformizing model access has scaled adoption from the first 5 production use cases to **30+ LLM/VLM use cases** across the company, and now powers the agentic assistant above.
        badges:
          - "LLM"
          - "VLM"
          - "vLLM"
          - "Kong Gateway"
          - "Grafana"

      - title: "Robust 360-8PA (ICRA 2021)"
        content: |
          Redesigning the normalized 8-point algorithm for 360° FoV images.
          Published at **IEEE International Conference on Robotics and Automation (ICRA), 2021**.
        featured:
