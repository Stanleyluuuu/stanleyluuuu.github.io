            content: |
              - **Promoted to Engineer II** after 2.5 years of leading the organization's computer vision and GenAI platforms.
              - **Raise the team's engineering bar** as a code reviewer for the AI team and a technical interviewer for engineering candidates.
              - **Building an internal agentic AI system**: a conversational assistant that uses Garmin's internal LLM API as its reasoning core and orchestrates APIs from the GenAI platform I administer — spanning language, LLM, and CV categories — as LangGraph tools, so users can complete tasks with text, images, or audio.
          - name: "AI Software Engineer I"
            date: "Nov 2023 – Jun 2026"
            info:
