            content: |
              - **Led Large-Scale AI Deployment** as the primary developer for an organization-wide computer vision platform, scaling and maintaining **200+ active production services**.
              - **Led GenAI Adoption** by evaluating **10+ LLM/VLM models** through structured proof-of-concepts, producing internal technical assessments that guided company-wide model adoption and shipped **5 use cases into production**.
              - **Mentored 2 interns** on AI system design and production deployment, guiding them to independently deliver **3–5 production services** and train **5 YOLO models** within the AI Surveillance Platform.

